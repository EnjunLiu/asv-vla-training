[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asv-vla-training"
version = "0.1.0"
description = "PC-only ASV VLA data, feature, and single-point training tools"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10",
  "PyYAML>=6",
  "jsonschema>=4",
  "torch>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asv_vla = ["schema/*.json"]
