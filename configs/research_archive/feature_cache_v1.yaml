# Frozen feature-cache contract for the single-step decision head.

feature_schema_version: "feature_cache_v2"
preprocess_version: "camera_entity_crop_v1"

# Fixed transform applied after decoding the original episode JPEG. UE5
# already applies this contract to published camera bytes, so the legacy cache
# path remains disabled unless a new bright cache is explicitly requested.
image_preprocess:
  contract: "ue5_capture_gamma065_brightness100_contrast100_v2"
  enabled: false
  gamma: 0.65
  brightness: 1.0
  contrast: 1.0
  implementation: "asv_vla.visual_encoder.enhance_low_light_image"
  input: "decoded_original_jpeg"
  random_brightness_augmentation: false

language:
  model_id: "Qwen/Qwen3-Embedding-0.6B"
  feature_dim: 256
  encode_each_instruction_once: true

visual:
  model_id: "torchvision:mobilenet_v3_small:IMAGENET1K_V1"
  feature_dim: 576
  input_size_px: 224
  global_token_count: 1
  maximum_entity_tokens: 16
  crop_size_px: 224

entity:
  maximum_entities: 16
  feature_dim: 16
  structured_color_columns_zero_based: [14, 15]
  entity_id_is_alignment_only: true

ego:
  fields: ["surge_velocity_mps", "yaw_rate_radps"]

expert:
  shape: [2]
  frame: "base_link"
  kind: "single_step_desired_displacement_m"

temporal:
  previous_action_field: "previous_expert_actions"
  previous_action_valid_field: "previous_action_valid"
  match: "same_run_same_instruction_adjacent_frame"
  invalid_context: "zero_action_and_false_valid_bit"

policy_decision_inputs:
  - language
  - entity_geometry
  - previous_action
  - language_valid
  - entity_geometry_mask
  - previous_action_valid
  - policy_input_valid
policy_decision_input_exclusions:
  - global_visual
  - entity_visual
  - ego

consistency:
  minimum_samples: 20
  cosine_similarity_threshold: 0.999
